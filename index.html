<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ADHD OPPS // HUD</title>
  <style>
    :root {
      --bg: #030803;
      --card: #081408;
      --border: #143a14;
      --text: #4ade80;
      --text-muted: #166534;
      --accent: #22c55e;
      --alert: #ef4444;
      --orange: #ea580c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Menlo', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
    }
    .hud-terminal {
      width: 100%;
      max-width: 420px;
      background-color: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.1);
    }
    .header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .badge { color: var(--accent); }
    .badge-retreat { color: var(--orange); }
    .countdown-box {
      margin-bottom: 14px;
    }
    .countdown-title {
      font-size: 15px;
      font-weight: bold;
      color: #fff;
    }
    .countdown-sub {
      font-size: 9.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn {
      background-color: #0d1e0d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: bold;
      padding: 14px 8px;
      text-align: center;
      text-decoration: none;
      display: block;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
      background-color: #143a14;
      border-color: var(--accent);
    }
    .btn-full {
      grid-column: span 2;
    }
    .btn-orange {
      border-color: #632304;
      color: var(--orange);
      background-color: #1f0b02;
    }
    .btn-orange:active {
      background-color: #3b1505;
      border-color: var(--orange);
    }
    .btn-alert {
      border-color: #551414;
      color: var(--alert);
      background-color: #1a0808;
    }
    .btn-alert:active {
      background-color: #330f0f;
      border-color: var(--alert);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="hud-terminal">
    <div class="header">
      <span>/// ADHD_OPPS // HUD</span>
      <span id="sysBadge" class="badge">[SYS: IN COMBAT]</span>
    </div>

    <div class="countdown-box">
      <div id="hudTitle" class="countdown-title">&gt;&gt; TAKTICKÝ TERMINÁL</div>
      <div id="hudSub" class="countdown-sub">STAND DOWN VE 20:00 // TELEMETRIE AKTIVNÍ</div>
    </div>

    <div class="grid">
      <a href="scriptable:///run?scriptName=ADHD%20BLACK%20OPPS&action=medic" class="btn">🧪 DEPLOY MEDIC</a>
      <a href="scriptable:///run?scriptName=ADHD%20BLACK%20OPPS&action=engaged" class="btn">🪂 ENGAGED</a>
      <a href="scriptable:///run?scriptName=ADHD%20BLACK%20OPPS&action=phd" class="btn">📡 PhD: +1h</a>
      <a href="scriptable:///run?scriptName=ADHD%20BLACK%20OPPS&action=exec" class="btn">🧱 EXEC_CONTROL</a>

      <!-- Jediné přepínací tlačítko s ALL-CAPS názvy -->
      <a id="toggleRetreatBtn" href="#" class="btn btn-full"></a>

      <a href="scriptable:///run?scriptName=ADHD%20BLACK%20OPPS&action=debrief" class="btn btn-full">📻 [COMMS] TAC_DEBRIEF (+1)</a>
      <a href="scriptable:///run?scriptName=ADHD%20BLACK%20OPPS&action=standdown" class="btn btn-full btn-alert">🚨 [PROTOCOL] STAND DOWN</a>
    </div>

    <div class="footer">
      <span>OBJ: MILESTONE D-12</span>
      <span>TERAPIE: 2× / MĚSÍC</span>
    </div>
  </div>

  <script>
    const SCRIPT_URL_BASE = "scriptable:///run?scriptName=ADHD%20BLACK%20OPPS";
    const btn = document.getElementById("toggleRetreatBtn");
    const badge = document.getElementById("sysBadge");
    const title = document.getElementById("hudTitle");
    const sub = document.getElementById("hudSub");

    let isRetreat = localStorage.getItem("adhd_hud_retreat") === "true";

    function renderState() {
      if (isRetreat) {
        btn.innerText = "⚡ [RE-ENGAGE] RETURN TO OPS";
        btn.className = "btn btn-full";
        btn.href = `${SCRIPT_URL_BASE}&action=reengage`;
        
        badge.innerText = "[SYS: TAC RETREAT]";
        badge.className = "badge badge-retreat";
        title.innerText = ">> TAC_RETREAT // POZASTAVENO";
        sub.innerText = "DNEŠNÍ OPERACE UKONČENY // REGENERACE POVOLENA";
      } else {
        btn.innerText = "🚁 [ABORT] TACTICAL RETREAT";
        btn.className = "btn btn-full btn-orange";
        btn.href = `${SCRIPT_URL_BASE}&action=abort`;
        
        badge.innerText = "[SYS: IN COMBAT]";
        badge.className = "badge";
        title.innerText = ">> TAKTICKÝ TERMINÁL";
        sub.innerText = "STAND DOWN VE 20:00 // TELEMETRIE AKTIVNÍ";
      }
    }

    btn.addEventListener("click", () => {
      isRetreat = !isRetreat;
      localStorage.setItem("adhd_hud_retreat", isRetreat);
      renderState();
    });

    renderState();
  </script>

</body>
</html>
